[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "RASOR"
version = "0.0.1"
authors = [
    {name = "Leslie Murat"}
]
description = "RASOR: deep-learning models for optical-flow-based cell registration and segmentation."
readme = "README.md"
license = { file = "LICENSE"}

dependencies = [
    "cellpose>=4.2.1.1",
    "einops>=0.8.2",
    "fastapi>=0.136.1",
    "Flask>=3.1.3",
    "matplotlib>=3.10.8",
    "mlflow>=3.12.0",
    "neurite @ git+https://github.com/adalca/neurite.git@b51b872a4834bd4ba906832737a578ee3a690eb4",
    "nibabel>=5.4.2",
    "numpy>=2.4.4",
    "opencv-python>=5.0.0.93",
    "pandas>=2.3.3",
    "pillow>=12.2.0",
    "pystrum>=0.4",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "segment-anything>=1.0",
    "timm>=1.0.28",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "tqdm>=4.67.3",
    "uvicorn>=0.47.0"
]


[tool.ruff]
line-length = 120
indent-width = 4


# Format
format.docstring-code-format = true
format.indent-style = "space"
format.quote-style = "double"
format.line-ending = "lf"
format.skip-magic-trailing-comma = false

# Lint
lint.select = ["ALL"]

lint.ignore = [
    "ANN001",  # Checked by mypy which allows default args not to be typed
    "COM812",  # Recommended by ruff as we use the formatter
    "D100",  # Module docstring
    "D107",  # __init__ docstring
    "EM", "TRY003",  # Let's rely on standard exceptions
    "FBT",  # Ignore boolean trap
    "FIX", "TD",  # Ignore TODO, FIXME, XXX
]

lint.future-annotations = true
lint.flake8-annotations.ignore-fully-untyped = true
lint.flake8-annotations.mypy-init-return = true
lint.pep8-naming.ignore-names = [
    "i",
    "j",
    "k",
    "n",
    "t",
]
lint.pydocstyle.convention = "google"
lint.pylint.max-args = 8
lint.pylint.max-statements = 75

[tool.mypy]
enable_error_code = ["ignore-without-code"]
check_untyped_defs = true

[tool.setuptools.packages.find]
where = ["src"]